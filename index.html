<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@200..700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
    
    <title>ARCHIE by Promotora RR 19</title>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <figure class="logo">
                        <img src="assets/img/logo-archie.svg" alt="ARCHIE by Promotora RR 19">
                    </figure>
                </div>
                <div class="col-12">
                    <nav class="nav">
                        <ul class="nav-list">
                            <li class="nav-item">
                                <a href="#" class="nav-link">Contact</a>
                            </li>
                            <li class="nav-item">
                                <a href="#" class="nav-link">Projects</a>
                            </li>
                            <li class="nav-item">
                                <a href="#" class="nav-link">Interior Design</a>
                            </li>
                            <li class="nav-item">
                                <a href="#" class="nav-link">Our Products</a>
                            </li>                            
                            <li class="nav-item">
                                <a href="#" class="nav-link">About Us</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </header>
    <main>
        <section class="hero">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-lg-11">
                        <div id="hero" class="carousel slide">
                            <div class="carousel-inner">
                              <div class="carousel-item active">
                                <figure>
                                    <img src="assets/img/hero-01.jpg" class="d-block w-100" alt="...">
                                </figure>
                              </div>
                              <div class="carousel-item">
                                <figure>
                                    <img src="assets/img/hero-02.jpg" class="d-block w-100" alt="...">
                                </figure>
                              </div>
                              <div class="carousel-item">
                                <figure>
                                    <img src="assets/img/hero-03.jpg" class="d-block w-100" alt="...">
                                </figure>
                              </div>
                              <div class="carousel-item">
                                <figure>
                                    <img src="assets/img/hero-04.jpg" class="d-block w-100" alt="...">
                                </figure>
                              </div>
                            </div>
                            <button class="carousel-control-prev" type="button" data-bs-target="#hero" data-bs-slide="prev">
                              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                              <span class="visually-hidden">Previous</span>
                            </button>
                            <button class="carousel-control-next" type="button" data-bs-target="#hero" data-bs-slide="next">
                              <span class="carousel-control-next-icon" aria-hidden="true"></span>
                              <span class="visually-hidden">Next</span>
                            </button>
                          </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="decoration">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-8 col-md-11">
                        <h2 class="title">Decoration Supply Distributor</h2>
                    </div>
                    <div class="col-11">
                        <div class="row">
                            <div class="col-12 col-sm-6 col-lg-3">
                                <article class="article">
                                    <figure>
                                        <img class="img-fluid" src="assets/img/decoration-01.jpg" alt="Distributor">
                                    </figure>
                                    <h3 class="article-title">Levita Lehm</h3>
                                </article>
                            </div>
                            <div class="col-12 col-sm-6 col-lg-3">
                                <article class="article">
                                    <figure>
                                        <img class="img-fluid" src="assets/img/decoration-02.jpg" alt="Distributor">
                                    </figure>
                                    <h3 class="article-title">Marmoleum Decibel</h3>
                                </article>
                            </div>
                            <div class="col-12 col-sm-6 col-lg-3">
                                <article class="article">
                                    <figure>
                                        <img class="img-fluid" src="assets/img/decoration-03.jpg" alt="Distributor">
                                    </figure>
                                    <h3 class="article-title">Seamless woven</h3>
                                </article>
                            </div>
                            <div class="col-12 col-sm-6 col-lg-3">
                                <article class="article">
                                    <figure>
                                        <img class="img-fluid" src="assets/img/decoration-04.jpg" alt="Distributor">
                                    </figure>
                                    <h3 class="article-title">Deltabeam</h3>
                                </article>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="design">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-8 col-md-11">
                        <h2 class="title">Design and Construction Projects</h2>
                    </div>
                    <div class="col-11">
                        <div class="row align-items-center">
                            <div class="col-md-12 col-lg-8">
                                <article class="article">
                                    <figure>
                                        <img class="img-fluid" src="assets/img/design-01.jpg" alt="Distributor">
                                    </figure>
                                    <h3 class="article-title">Levita Lehm</h3>
                                </article>
                            </div>
                            <div class="col-12 col-lg-4">
                                <div class="row">
                                    <div class="col-6 col-lg-12">
                                        <article class="article">
                                            <figure>
                                                <img class="img-fluid" src="assets/img/design-02.jpg" alt="Distributor">
                                            </figure>
                                            <h3 class="article-title">Marmoleum Decibel</h3>
                                        </article>
                                    </div>
                                    <div class="col-6 col-lg-12">
                                        <article class="article">
                                            <figure>
                                                <img class="img-fluid" src="assets/img/design-03.jpg" alt="Distributor">
                                            </figure>
                                            <h3 class="article-title">Seamless woven</h3>
                                        </article>
                                    </div>
                                </div>
                            </div>                            
                        </div>
                    </div>
                </div>
            </div>

    <footer class="footer">
        <img src="assets/img/logo-archie.svg" alt="ARCHIE by Promotora RR 19">
        <p>All right reserve. 2025. <strong>ARCHIE</strong>.</p>
